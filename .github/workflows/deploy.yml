# Deploy — gated on VERCEL_TOKEN + RAILWAY_TOKEN secrets.
# ORG/PROJECT IDs and Railway service names come from repository vars (see STAGING.md).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
  push:
    branches: [main, master]

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    steps:
      - name: Check deploy secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$RAILWAY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN and/or RAILWAY_TOKEN missing — skipping staging deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        if: steps.gate.outputs.skip == 'false'
        run: pnpm --filter @t360/database generate

      - name: Build web + admin
        if: steps.gate.outputs.skip == 'false'
        run: |
          pnpm --filter @t360/web build
          pnpm --filter @t360/admin build

      - name: Deploy web to Vercel (staging)
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_WEB }}
        run: |
          # Use production env for build so preview placeholders cannot break next build.
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"

      - name: Deploy admin to Vercel (staging)
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"

      - name: Deploy API to Railway (staging)
        if: steps.gate.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --environment staging --detach || \
          railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --detach

      - name: Deploy worker to Railway (staging)
        if: steps.gate.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service "${{ vars.RAILWAY_WORKER_SERVICE }}" --environment staging --detach || \
          railway up --service "${{ vars.RAILWAY_WORKER_SERVICE }}" --detach

      - name: Post-deploy smoke
        if: steps.gate.outputs.skip == 'false' && vars.STAGING_API_BASE != ''
        env:
          API_BASE: ${{ vars.STAGING_API_BASE }}
        run: bash scripts/launch/smoke.sh

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    steps:
      - name: Check deploy secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$RAILWAY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN and/or RAILWAY_TOKEN missing — skipping production deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        if: steps.gate.outputs.skip == 'false'
        run: pnpm --filter @t360/database generate

      - name: Build web + admin
        if: steps.gate.outputs.skip == 'false'
        run: |
          pnpm --filter @t360/web build
          pnpm --filter @t360/admin build

      - name: Deploy web to Vercel (production)
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_WEB }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy admin to Vercel (production)
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy API to Railway (production)
        if: steps.gate.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --environment production --detach || \
          railway up --service "${{ vars.RAILWAY_API_SERVICE }}" --detach

      - name: Deploy worker to Railway (production)
        if: steps.gate.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service "${{ vars.RAILWAY_WORKER_SERVICE }}" --environment production --detach || \
          railway up --service "${{ vars.RAILWAY_WORKER_SERVICE }}" --detach

      - name: Post-deploy smoke
        if: steps.gate.outputs.skip == 'false' && vars.PROD_API_BASE != ''
        env:
          API_BASE: ${{ vars.PROD_API_BASE }}
        run: bash scripts/launch/smoke.sh
