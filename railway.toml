# Railway hints for API + worker (same Dockerfile).
# Create two services from this repo; set root directory / Dockerfile path to apps/api/Dockerfile.
# Worker service: override start command to `node dist/src/worker.js`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Prefer image script (resolves Prisma under /app/database pnpm layout).
# Railway accepts a single shell command string (not argv arrays).
preDeployCommand = ["/bin/sh /app/predeploy-migrate.sh"]
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
