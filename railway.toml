# Railway hints for API + worker (same Dockerfile).
# Create two services from this repo; set root directory / Dockerfile path to apps/api/Dockerfile.
# Worker service: override start command to `node dist/src/worker.js`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# pnpm puts the Prisma CLI under database/, not repo-root node_modules/.bin
preDeployCommand = ["cd /app/database && ./node_modules/.bin/prisma migrate deploy --schema=./prisma/schema.prisma"]
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
