name: tharagai_mobile
description: Tharagai customer Flutter app (t360 Phase 9)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  razorpay_flutter: ^1.4.0
  video_player: ^2.9.5
  image_picker: ^1.1.2
  http_parser: ^4.0.2
  share_plus: ^12.0.2
  local_auth: ^2.3.0
  app_links: ^6.4.0
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_native_splash:
  color: "#070000"
  background_image: assets/branding/tharagai_splash.png
  fullscreen: true
  android: true
  ios: true
  android_12:
    color: "#070000"
    image: assets/branding/tharagai_splash_android12.png
  android_gravity: center
  ios_content_mode: scaleAspectFit

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/tharagai_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/tharagai_icon.png
  remove_alpha_ios: true
